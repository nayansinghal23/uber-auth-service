name: UberAuthService CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build and Test Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Auth Service
        uses: actions/checkout@v4

      - name: Checkout Entity Service
        uses: actions/checkout@v4
        with:
          repository: nayansinghal23/uber-entity-service
          path: entity-service

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build and publish Entity Service
        working-directory: entity-service
        run: |
          chmod +x gradlew
          ./gradlew clean publishToMavenLocal

      - name: Build and test Auth Service
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Verify executable JAR
        run: |
          test -f build/libs/UberAuthService-0.0.1-SNAPSHOT.jar
          jar tf build/libs/UberAuthService-0.0.1-SNAPSHOT.jar | grep -q 'BOOT-INF/'