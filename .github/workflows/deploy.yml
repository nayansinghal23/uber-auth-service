name: UberAuthService CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean build

      - name: Verify executable JAR
        run: |
          test -f build/libs/UberAuthService-0.0.1-SNAPSHOT.jar
          jar tf build/libs/UberAuthService-0.0.1-SNAPSHOT.jar | grep -q 'BOOT-INF/'