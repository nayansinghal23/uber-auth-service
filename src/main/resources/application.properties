spring.application.name=UberAuthService
server.port=7477
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/uber_db_local}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Classcard123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.flyway.enabled=false
logging.level.org.springframework.data=DEBUG
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
jwt.accessTokenExpiry=900
jwt.refreshTokenExpiry=604800
jwt.secret=Nayan_Singhal_Software_Developer
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
aws.access-key=${AWS_ACCESS_KEY_ID:}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.region=${AWS_REGION:ap-south-1}
aws.s3.bucket=${AWS_S3_BUCKET:uber-project-s3}
spring.config.import=optional:file:./gradle.properties
